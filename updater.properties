# Updater configuration
# REQUIRED: GitHub repository in owner/repo format
# Regular (stable) releases repo
repo=MinecraftOldschoolEdition/release-patches

# Beta repository (owner/repo) used when "Get beta updates" is checked
betaRepo=MinecraftOldschoolEdition/beta-patches

# Regex to match the mod jar asset in the latest release
jarRegex=patch\.jar

# Optional: Regex to match the LAN server jar asset in the latest release.
# When present, it is installed as minecraftDir/lan-server/server.jar.
serverJarRegex=server\.jar

# Optional: Regex to match an assets zip in the release (if present)
# If missing, the updater will fall back to the release's zipball and
# extract only the resources/assets subtree if it exists.
assetsRegex=(assets|resources).*(?i)\.zip

# Install mode: mods | clientJar | jarmods
mode=jarmods

# When mode=jarmods, the destination filename inside instanceRoot/jarmods
jarmodName=mod.jar

# Game directory (instance). Adjust to your setup.
# For this repo, the client instance is under minecraft/game
minecraftDir=../../minecraft/game

# Optional: URL to show in the launcher's embedded patch-notes area.
# When omitted, the latest GitHub release notes are rendered instead.
newsUrl=https://minecraftoldschool.com/updates.html

# Repository used for pre-launch resource sync.
resourcePackRepo=MinecraftOldschoolEdition/resourcepack

# Branch used for stable resource sync (launcher falls back to master when main is unavailable).
resourcePackBranch=main

# Branch used for resource sync when "Get beta updates" is checked.
resourcePackBetaBranch=beta

# Optional independently hosted public HTTPS ZIP contingency. Supports {repo} and {branch} placeholders.
# Example: https://resources.example.com/{repo}/{branch}/resourcepack.zip
resourcePackArchiveMirrorUrl=

# Minimum minutes between local integrity scans when the remote commit is unchanged (0 scans every launch).
resourcePackCheckIntervalMinutes=60

# Repository containing the versioned Prism LWJGL component patch.
# Publish org.lwjgl.json as a release asset and bump the release tag for each update.
lwjgl3Repo=MinecraftOldschoolEdition/lwjgl3-patch-fetcher
lwjgl3AssetRegex=^org[.]lwjgl[.]json$

# Launcher self-update assets published by MinecraftOldschoolEdition/launcher-updates.
launcherJarRegex=mod-updater-gui\.jar
launcherPromoterJarRegex=launcher-promoter\.jar
